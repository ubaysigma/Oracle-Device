<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Prescript Device</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       THEME & RESETS
       Cold, mechanical, sterile Index-inspired aesthetic
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0A0A0A;
      --text-primary: #E6E6E6;
      --text-muted: #555555;
      --text-subtle: #8A8A8A;
      --accent-active: #FFFFFF;
      --font-mono: 'Fira Code', 'Roboto Mono', 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-mono);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      user-select: none;
    }

    /* ==========================================================================
       LAYOUT - Extreme minimalism, perfectly centered
       ========================================================================== */
    .viewport {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100vw;
      height: 100vh;
      padding: 40px 24px;
    }

    /* Top mechanical header */
    .header {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 400;
      transition: color 0.3s ease;
    }

    .header-active {
      color: var(--text-subtle);
    }

    /* Center stage */
    .center-stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      max-width: 760px;
      width: 100%;
      text-align: center;
      padding: 0 16px;
    }

    /* Initial state button */
    .receive-button {
      background: none;
      border: none;
      color: var(--text-subtle);
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 16px 24px;
      transition: color 0.2s ease, letter-spacing 0.2s ease;
      outline: none;
    }

    .receive-button:hover,
    .receive-button:focus-visible {
      color: var(--accent-active);
      letter-spacing: 0.24em;
    }

    .receive-button:disabled {
      cursor: default;
      color: var(--text-muted);
    }

    /* Prescript container */
    .prescript-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .prescript-text {
      font-size: 18px;
      line-height: 1.8;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--text-primary);
      text-wrap: balance;
    }

    .prescript-meta {
      margin-top: 28px;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Subtle fade-in animation */
    .fade-in {
      animation: fadeInEffect 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInEffect {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Bottom index footer */
    .footer {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .viewport {
        padding: 24px 16px;
      }
      .prescript-text {
        font-size: 15px;
        line-height: 1.7;
      }
      .receive-button {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <!-- Unobtrusive Top Status -->
    <header class="header header-active">DEVICE: ACTIVE</header>

    <!-- Perfectly Centered Operational Zone -->
    <main class="center-stage">
      <button id="btn-receive" class="receive-button" aria-label="Receive Prescript">
        - Click to Receive -
      </button>

      <article id="prescript-display" class="prescript-container" aria-live="polite">
        <p id="prescript-body" class="prescript-text"></p>
        <span class="prescript-meta">EXECUTION IS MANDATORY</span>
      </article>
    </main>

    <!-- Minimal Terminal Footer -->
    <footer class="footer">
      <span id="label-date">INDEX PROTOCOL</span>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';

      // ========================================================================
      // 1. DATA ARRAYS (Procedural Generation)
      // ========================================================================
      const actions = [
        "Laksanakan", "Eksekusi", "Selesaikan", "Konsumsi", 
        "Tonton dan cerna", "Push", "Pelajari", "Rapihkan", "Tinggalkan sejenak"
      ];

      const targets = [
        "minimal 1 commit kode ke repositori GitHub", "satu porsi sayuran hijau", 
        "ibadah wajibmu", "satu video pembelajaran pengembangan perangkat lunak", 
        "dokumentasi framework atau bahasa pemrograman baru", "gelas berisi air putih penuh", 
        "meja komputermu dari barang yang tidak perlu", "satu struktur database atau UI yang sedang kamu rancang", 
        "bacaan literatur atau satu chapter ceritamu"
      ];

      const conditions = [
        "sebelum kamu membuka aplikasi game apa pun hari ini.", "tanpa menyentuh layar handphone selama prosesnya berlangsung.", 
        "sambil mempertahankan postur punggung yang lurus tegak.", "sebelum matahari terbenam.", 
        "dengan keheningan total, tanpa mendengarkan musik.", "sebelum kamu membuka kembali tab browser yang tidak penting.", 
        "sebagai bentuk kedisiplinan absolut.", "segera setelah kamu membaca pesan ini."
      ];

      // LocalStorage Keys
      const STORAGE_KEY_DATE = "DAILY_PRESCRIPT_DEVICE_DATE";
      const STORAGE_KEY_TEXT = "DAILY_PRESCRIPT_DEVICE_TEXT";

      // DOM Elements
      const btnReceive = document.getElementById('btn-receive');
      const prescriptDisplay = document.getElementById('prescript-display');
      const prescriptBody = document.getElementById('prescript-body');
      const labelDate = document.getElementById('label-date');

      // ========================================================================
      // 2. SEEDED PRNG (Mulberry32 + 32-bit FNV-1a Hash)
      // Guaranteed deterministic output for a given date seed string
      // ========================================================================
      function hashDateSeed(str) {
        let hash = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          hash ^= str.charCodeAt(i);
          hash = Math.imul(hash, 16777619) >>> 0;
        }
        return hash;
      }

      function createMulberry32(seed) {
        return function () {
          let t = seed = (seed + 0x6D2B79F5) >>> 0;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), (t | 61) >>> 0);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function generatePrescript(dateStr) {
        const seed = hashDateSeed(dateStr);
        const random = createMulberry32(seed);

        const actionIndex = Math.floor(random() * actions.length);
        const targetIndex = Math.floor(random() * targets.length);
        const conditionIndex = Math.floor(random() * conditions.length);

        return `${actions[actionIndex]} ${targets[targetIndex]} ${conditions[conditionIndex]}`;
      }

      // Format current local date as YYYY-MM-DD
      function getLocalDateString() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      // ========================================================================
      // 3. UI STATE & STORAGE LOGIC
      // ========================================================================
      function revealPrescript(text, animate) {
        btnReceive.style.display = 'none';
        prescriptBody.textContent = text;
        prescriptDisplay.style.display = 'flex';

        if (animate) {
          prescriptDisplay.classList.remove('fade-in');
          // Trigger reflow to restart animation
          void prescriptDisplay.offsetWidth;
          prescriptDisplay.classList.add('fade-in');
        }
      }

      function handleReceive() {
        const today = getLocalDateString();
        const prescriptText = generatePrescript(today);

        try {
          localStorage.setItem(STORAGE_KEY_DATE, today);
          localStorage.setItem(STORAGE_KEY_TEXT, prescriptText);
        } catch (e) {
          console.warn("LocalStorage access restricted:", e);
        }

        revealPrescript(prescriptText, true);
      }

      // Initial page load check
      function init() {
        const today = getLocalDateString();
        labelDate.textContent = `INDEX PROTOCOL // ${today}`;

        let savedDate = null;
        let savedText = null;

        try {
          savedDate = localStorage.getItem(STORAGE_KEY_DATE);
          savedText = localStorage.getItem(STORAGE_KEY_TEXT);
        } catch (e) {
          console.warn("LocalStorage unavailable:", e);
        }

        // Once-a-day check: if already received for today, display immediately
        if (savedDate === today && savedText) {
          revealPrescript(savedText, false);
        } else {
          // Ready for receiving today's command
          btnReceive.style.display = 'block';
          prescriptDisplay.style.display = 'none';
          btnReceive.addEventListener('click', handleReceive);
        }
      }

      // Run on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
